name: "Feature — PR Validation"

# Sirf PR pe chalta hai — koi deploy nahi
# feature/* → develop ke PR pe test + lint + build check
on:
  pull_request:
    branches: [develop, staging, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:

  # ── Run tests ─────────────────────────────────────────
  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV:   test
          JWT_SECRET: test-secret-for-ci

  # ── Docker build check ────────────────────────────────
  build-check:
    name: "Docker build check"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Docker build (no push)
        run: |
          docker build -t ecr-ecs-backend:pr-${{ github.event.pull_request.number }} .
          echo "Docker build successful — image NOT pushed to ECR"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: [
                '### Backend PR Check',
                '',
                '| Check | Status |',
                '| --- | --- |',
                '| Tests | passed |',
                '| Docker build | passed |',
                '',
                `PR: **${context.payload.pull_request.head.ref}** → **${context.payload.pull_request.base.ref}**`,
                '',
                '_Note: Image will be built and pushed to ECR only after merge._'
              ].join('\n')
            });
