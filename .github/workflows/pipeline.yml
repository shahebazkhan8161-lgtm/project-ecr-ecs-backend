name: "Backend — Test, Build & Push"

on:
  push:
    branches:
      - develop
      - staging
      - main
      - 'hotfix/*'    # hotfix branches bhi trigger karti hain
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ── Detect environment from branch ───────────────────
  set-env:
    name: "Set Environment"
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag:   ${{ steps.env.outputs.image_tag }}
      role_arn:    ${{ steps.env.outputs.role_arn }}

    steps:
      - name: Detect environment
        id: env
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if   [ "$BRANCH" = "main" ];    then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "image_tag=prod-$SHA"    >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.PROD_IAM_ROLE_ARN }}" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "staging" ]; then
            echo "environment=uat"        >> $GITHUB_OUTPUT
            echo "image_tag=uat-$SHA"     >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.UAT_IAM_ROLE_ARN }}"  >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == hotfix/* ]]; then
            # hotfix → seedha production mein jaata hai
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "image_tag=hotfix-$SHA"  >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.PROD_IAM_ROLE_ARN }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev"        >> $GITHUB_OUTPUT
            echo "image_tag=dev-$SHA"     >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.DEV_IAM_ROLE_ARN }}"  >> $GITHUB_OUTPUT
          fi

  # ── Run Tests ─────────────────────────────────────────
  test:
    name: "Test"
    runs-on: ubuntu-latest
    needs: set-env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          NODE_ENV:   test
          JWT_SECRET: test-secret-for-ci

  # ── Build & Push to ECR ───────────────────────────────
  build-and-push:
    name: "Docker Build & ECR Push [${{ needs.set-env.outputs.environment }}]"
    runs-on: ubuntu-latest
    needs: [set-env, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ needs.set-env.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ needs.set-env.outputs.role_arn }}
          aws-region:        ${{ vars.AWS_REGION }}
          role-session-name: gh-be-${{ needs.set-env.outputs.environment }}-${{ github.run_id }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.set-env.outputs.image_tag }}
          ENV: ${{ needs.set-env.outputs.environment }}
        run: |
          docker build -t $REG/ecr-ecs-backend:$TAG        .
          docker build -t $REG/ecr-ecs-backend:$ENV-latest .
          docker push $REG/ecr-ecs-backend:$TAG
          docker push $REG/ecr-ecs-backend:$ENV-latest

      - name: Summary
        run: |
          echo "### Backend Build Complete"  >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"             >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |"               >> $GITHUB_STEP_SUMMARY
          echo "| Env | ${{ needs.set-env.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ needs.set-env.outputs.image_tag }} |"   >> $GITHUB_STEP_SUMMARY

  # ── Notify Infra Repo ─────────────────────────────────
  trigger-infra-deploy:
    name: "Trigger Infra Deploy"
    runs-on: ubuntu-latest
    needs: [set-env, build-and-push]
    if: github.event_name == 'push'

    steps:
      - name: Dispatch to infra repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo:  'project-ecr-ecs-infra',
              event_type: 'backend-updated',
              client_payload: {
                environment: '${{ needs.set-env.outputs.environment }}',
                image_tag:   '${{ needs.set-env.outputs.image_tag }}',
                triggered_by: 'backend',
                commit_sha:  '${{ github.sha }}'
              }
            });
            console.log('Infra repo triggered successfully');
